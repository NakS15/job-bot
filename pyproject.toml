[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "MCP server that stores a resume, tracks tailored job matches in a spreadsheet, and applies after approval"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "playwright>=1.45",
    "pyyaml>=6.0",
    "keyring>=24",
    "uv>=0.4",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]
